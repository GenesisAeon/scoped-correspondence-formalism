name: verify

on:
  push:
  pull_request:

jobs:
  math:
    name: Math checks (analytic/synthetic verify_*.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m pip install -r verification/requirements.txt
      - run: python scripts/run_verification_suite.py --category math

  data:
    name: Real-data checks (verify_*.py using data/ provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m pip install -r verification/requirements.txt
      - run: python scripts/run_verification_suite.py --category data

  links:
    name: Internal Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/run_verification_suite.py --category links
