name: Release

# Tag push "v*" -> verify -> build -> PyPI (Trusted Publishing) -> GitHub Release.
# Zenodo archives the GitHub Release through the repository's Zenodo GitHub
# integration (metadata from .zenodo.json); no Zenodo token is needed here.
# PyPI upload uses Trusted Publishing (OIDC, no token) since 2026-10-02.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify before release (math + links + version metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m pip install -r verification/requirements.txt
      - name: Tag must match the package version
        run: |
          v=$(python -c "import scoped_correspondence as s; print(s.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
      - run: python scripts/run_verification_suite.py --category math
      - run: python scripts/run_verification_suite.py --category links

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    # PyPI Trusted Publishing (OIDC), registered by Johann 2026-10-02:
    # owner GenesisAeon, repo scoped-correspondence-formalism, workflow
    # release.yml, NO environment. Any mismatch makes the upload fail.
    # The PYPI_API_TOKEN secret is no longer used here.
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release (triggers Zenodo archiving)
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .github/release_body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
