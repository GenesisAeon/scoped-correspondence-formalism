[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-correspondence"
version = "0.41.0a1"
description = "Formal correspondence contracts between mathematical models, with an independently verified library spanning dynamical systems, information theory (directed information / information flow), thermodynamics, and viability theory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Johann Römer" },
]
keywords = [
    "correspondence",
    "dynamical-systems",
    "formal-verification",
    "information-theory",
    "viability-theory",
    "scientific-computing",
    "identifiability",
    "causal-inference",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["numpy", "scipy"]

[project.urls]
Repository = "https://github.com/GenesisAeon/scoped-correspondence-formalism"
History = "https://github.com/GenesisAeon/scoped-correspondence-formalism/blob/master/HISTORY.md"

[tool.setuptools.packages.find]
where = ["src"]
