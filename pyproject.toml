[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-correspondence"
version = "0.4.0a1"
description = "Correspondence + Observation/Dynamics/Coupling + Closure/Viability + Membership cores (M1-M4 review package)"
readme = "docs/correspondence_core.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
